name: Build resume PDF
on: {push: {branches: [main], paths: [resume/resume.tex, .github/workflows/build-resume.yml]}, pull_request: {branches: [main], paths: [resume/resume.tex, .github/workflows/build-resume.yml]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: xu-cheng/latex-action@v3, with: {working_directory: resume, root_file: resume.tex, latexmk_use_xelatex: true}}, {run: "mv resume/resume.pdf resume/Arman_Pouyaei_Resume.pdf"}, {if: "github.event_name == 'push'", run: "git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add resume/Arman_Pouyaei_Resume.pdf && if git diff --cached --quiet; then echo 'PDF unchanged.'; else git commit -m 'Build resume PDF [skip ci]' && git push; fi"}]}}